<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1400" role="img" aria-labelledby="title description">
  <title id="title">Orbit Art 3D logo</title>
  <desc id="description">Transparent-background logo with a violet segmented orbit symbol and Orbit Art 3D wordmark.</desc>
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C278FF"/>
      <stop offset=".46" stop-color="#7A2CE4"/>
      <stop offset="1" stop-color="#3B116F"/>
    </linearGradient>
    <linearGradient id="violetLight" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#E2AEFF"/>
      <stop offset=".36" stop-color="#A04BFA"/>
      <stop offset="1" stop-color="#5216A5"/>
    </linearGradient>
    <linearGradient id="darkViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F26C9"/>
      <stop offset="1" stop-color="#240A51"/>
    </linearGradient>
    <linearGradient id="core" x1=".12" y1="0" x2=".92" y2="1">
      <stop offset="0" stop-color="#23213E"/>
      <stop offset="1" stop-color="#090815"/>
    </linearGradient>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#1C093B" flood-opacity=".38"/>
    </filter>
    <filter id="smallShadow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#18072D" flood-opacity=".42"/>
    </filter>
  </defs>

  <!-- Transparent canvas: this file intentionally has no background rectangle. -->
  <g transform="translate(800 670)" filter="url(#softShadow)">
    <!-- Upper-left orbit shard -->
    <path d="M-468-152C-460-383-245-533-29-517c101 7 193 47 261 112 18 17 7 46-17 47-20 1-40-14-62-24-72-35-153-49-234-37-138 20-252 116-299 249-11 31-56 42-82 18-25-23-36-60-35-100Z" fill="url(#violet)" stroke="#1E0B42" stroke-width="12" stroke-linejoin="round"/>
    <path d="M-417-180c28-124 130-224 256-255 83-21 166-10 231 25-112-30-221-7-306 57-65 50-106 113-128 193-11 39-72 36-63-20Z" fill="#D29AFF" opacity=".24"/>
    <path d="M-318-284c42-67 106-117 183-140 59-18 117-16 170-3-106-3-207 42-269 123-22 29-58 55-80 30-15-17-6-42 18-78Z" fill="#F1D1FF" opacity=".30"/>

    <!-- Upper-right orbit shard -->
    <path d="M221-368c35-23 81-17 114 11 105 90 164 219 157 355-1 31-42 42-59 16-57-88-143-154-244-187-30-10-38-50-14-71 14-13 29-23 46-34Z" fill="url(#darkViolet)" stroke="#1E0B42" stroke-width="12" stroke-linejoin="round"/>
    <path d="M259-338c22-9 43 0 61 15 72 61 117 144 129 236-45-82-108-143-190-180-29-13-27-57 0-71Z" fill="#C782FF" opacity=".24"/>

    <!-- Right orbit shard -->
    <path d="M346 32c25-29 72-18 82 19 26 95 13 196-38 281-13 23-47 22-59-1-12-23-6-48 3-70 27-63 31-135 11-202-8-27-17-51 1-75Z" fill="url(#violetLight)" stroke="#1E0B42" stroke-width="12" stroke-linejoin="round"/>
    <path d="M371 69c23 63 22 132-2 195-8 20-22 23-26 6 18-55 18-112 3-166-4-14 13-47 25-35Z" fill="#F0C6FF" opacity=".30"/>

    <!-- Lower-right orbit shard -->
    <path d="M204 268c31-9 63 13 57 46-11 61-42 117-92 159-62 53-141 84-222 86-34 1-49-43-21-63 54-40 91-94 109-158 8-27 32-48 60-55l109-19Z" fill="url(#violet)" stroke="#1E0B42" stroke-width="12" stroke-linejoin="round"/>
    <path d="M199 301c-31 72-85 128-153 159 63-11 120-38 164-81 25-24 30-66-11-78Z" fill="#D9A2FF" opacity=".26"/>

    <!-- Lower-left orbit shard -->
    <path d="M-404 183c18-17 46-15 63 2 61 63 143 104 232 114 35 4 50 47 20 67-50 34-109 51-171 47-104-6-198-57-261-139-19-25-2-60 29-60 35 0 62 43 88 69Z" fill="url(#darkViolet)" stroke="#1E0B42" stroke-width="12" stroke-linejoin="round"/>
    <path d="M-422 165c57 62 129 99 211 110-55 8-113-3-164-33-35-20-66-49-90-81-14-19 22-25 43 4Z" fill="#B964FF" opacity=".35"/>

    <!-- Floating orbital nodes -->
    <g filter="url(#smallShadow)" stroke="#1E0B42" stroke-width="9">
      <circle cx="-318" cy="-42" r="31" fill="url(#violetLight)"/>
      <circle cx="203" cy="-41" r="27" fill="url(#violet)"/>
      <circle cx="-317" cy="205" r="24" fill="url(#violetLight)"/>
      <circle cx="199" cy="204" r="23" fill="url(#violet)"/>
    </g>
    <g fill="#F0C8FF" opacity=".5">
      <circle cx="-328" cy="-53" r="8"/>
      <circle cx="193" cy="-50" r="7"/>
      <circle cx="-325" cy="197" r="6"/>
      <circle cx="191" cy="197" r="6"/>
    </g>

    <!-- 3D central O / core -->
    <g filter="url(#smallShadow)">
      <circle r="92" fill="url(#core)" stroke="#261046" stroke-width="12"/>
      <circle r="58" fill="url(#violetLight)"/>
      <circle r="28" fill="#F7EEFF"/>
      <path d="M-31-42c22-18 54-15 70 2-17-7-37-5-51 7-13 11-20 27-20 44-15-16-19-37 1-53Z" fill="#FFF3FF" opacity=".4"/>
    </g>
  </g>

  <g text-anchor="middle">
    <text x="800" y="164" fill="#141224" font-family="Montserrat, Arial Black, Arial, sans-serif" font-size="164" font-weight="900" letter-spacing="10">ORBIT</text>
    <path d="M539 209h522" stroke="#8A36E8" stroke-width="12" stroke-linecap="round"/>
    <text x="800" y="1248" fill="#141224" font-family="Montserrat, Arial, sans-serif" font-size="126" font-weight="800" letter-spacing="4">ART</text>
    <text x="1019" y="1248" fill="#8A36E8" font-family="Montserrat, Arial, sans-serif" font-size="126" font-weight="900" letter-spacing="-4">3D</text>
  </g>
</svg>
